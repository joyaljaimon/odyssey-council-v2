<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odyssey Council · Call simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy: #1a3a52; --deep: #102f46; --abyss: #071a2a; --parch: #f6eddf; --parch2: #eee3d2; --gold: #e8c97a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: linear-gradient(180deg, var(--deep), var(--abyss)); color: var(--parch); font-family: "Barlow Semi Condensed", "Arial Narrow", sans-serif; display: grid; place-items: center; }
  main { width: min(100vw - 32px, 1100px); padding: 24px 0; }
  h1 { font: 600 13px "Barlow Semi Condensed", sans-serif; letter-spacing: .3em; text-align: center; color: var(--gold); margin: 0 0 16px; }
  .screen { position: relative; aspect-ratio: 16 / 9; background: var(--abyss); border-radius: 14px; overflow: hidden; outline: 1px solid rgba(246,237,223,.25); outline-offset: 6px; box-shadow: 0 24px 70px rgba(0,0,0,.55); }
  .screen img { width: 100%; height: 100%; display: block; }
  .screen video { position: absolute; right: 14px; bottom: 14px; width: 21%; border-radius: 10px; border: 2px solid var(--parch); transform: scaleX(-1); background: var(--deep); }
  .start { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7,26,42,.82); }
  button { font: 700 15px "Barlow Semi Condensed", sans-serif; letter-spacing: .18em; text-transform: uppercase; padding: 15px 40px; border-radius: 999px; border: 0; background: linear-gradient(var(--parch), var(--parch2)); color: var(--navy); cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  button:hover { filter: brightness(1.04); }
  p { color: rgba(246,237,223,.7); text-align: center; font-size: 15px; letter-spacing: .02em; margin-top: 22px; }
</style>
</head>
<body>
<main>
  <h1>THE ODYSSEY COUNCIL · CALL SIMULATOR</h1>
  <div class="screen">
    <img id="stage" alt="The Council">
    <video id="cam" autoplay muted playsinline></video>
    <div class="start" id="start"><button id="go">Call the Council</button></div>
  </div>
  <p id="note">This is what a FaceTime caller sees and hears. Ask out loud, or hold something up to your camera. Use headphones for best results.</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
$("go").onclick = async () => {
  $("start").remove();
  const media = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 }, video: { width: 1280, height: 720 } });
  $("cam").srcObject = media;
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/call`);
  ws.binaryType = "arraybuffer";
  const send = (tag, buf) => { if (ws.readyState !== 1) return; const out = new Uint8Array(buf.byteLength + 1); out[0] = tag; out.set(new Uint8Array(buf), 1); ws.send(out); };

  // mic -> 16 kHz PCM16
  const mic = new AudioContext();
  const worklet = `class Tap extends AudioWorkletProcessor { process(i) { if (i[0][0]) this.port.postMessage(i[0][0].slice(0)); return true; } } registerProcessor("tap", Tap);`;
  await mic.audioWorklet.addModule(URL.createObjectURL(new Blob([worklet], { type: "text/javascript" })));
  const tap = new AudioWorkletNode(mic, "tap");
  mic.createMediaStreamSource(media).connect(tap);
  const ratio = mic.sampleRate / 16000;
  let acc = [];
  tap.port.onmessage = ({ data }) => {
    for (let i = 0; i < data.length; i += ratio) acc.push(data[Math.floor(i)]);
    if (acc.length >= 640) {
      const pcm = new Int16Array(acc.length);
      for (let i = 0; i < acc.length; i++) pcm[i] = Math.max(-1, Math.min(1, acc[i])) * 32767;
      acc = [];
      send(1, pcm.buffer);
    }
  };

  // camera -> a JPEG a second
  const snap = document.createElement("canvas");
  setInterval(() => {
    const v = $("cam");
    if (!v.videoWidth) return;
    snap.width = 640; snap.height = Math.round(640 * v.videoHeight / v.videoWidth);
    snap.getContext("2d").drawImage(v, 0, 0, snap.width, snap.height);
    snap.toBlob((b) => b && b.arrayBuffer().then((buf) => send(2, buf)), "image/jpeg", 0.8);
  }, 1000);

  // Council voice (24 kHz PCM16) and stage (JPEG)
  const out = new AudioContext({ sampleRate: 24000 });
  let at = 0;
  const playing = new Set();
  let lastUrl = null;
  ws.onmessage = ({ data }) => {
    const bytes = new Uint8Array(data);
    const tag = bytes[0], body = data.slice(1);
    if (tag === 1) {
      const pcm = new Int16Array(body);
      const buf = out.createBuffer(1, pcm.length, 24000);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
      const src = out.createBufferSource();
      src.buffer = buf; src.connect(out.destination);
      at = Math.max(at, out.currentTime + 0.06);
      src.start(at); at += buf.duration;
      playing.add(src); src.onended = () => playing.delete(src);
    } else if (tag === 2) {
      const url = URL.createObjectURL(new Blob([body], { type: "image/jpeg" }));
      $("stage").src = url;
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = url;
    } else if (tag === 3) {
      playing.forEach((s) => s.stop()); playing.clear(); at = 0;
    }
  };
  ws.onclose = () => { $("note").textContent = "Call ended. Reload to call again."; };
};
</script>
</body>
</html>
